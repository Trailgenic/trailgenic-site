name: Snapshot live site
on:
  push:
    branches: [main]
    paths: ["snapshot/REQUEST"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Take snapshot
        run: |
          rm -rf snapshot/raw snapshot/manifest.json
          python3 tools/snapshot.py snapshot
      - name: Commit snapshot
        run: |
          git config user.name "trailgenic-snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add snapshot
          git commit -m "Snapshot of live site $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
