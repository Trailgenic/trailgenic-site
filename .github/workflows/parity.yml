name: Parity check against a deployment
on:
  push:
    branches: [main]
    paths: ["reports/REMOTE_REQUEST"]
  workflow_dispatch:
    inputs:
      base:
        description: "Deployment address, e.g. https://trailgenic-site.vercel.app"
        required: true
permissions:
  contents: write
concurrency: parity
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: npm ci
      - name: Checker tests
        run: npm test
      - name: Build
        run: node build.mjs
      - name: Changes since cutover (build vs snapshot)
        run: python3 tools/parity_local.py
      - name: Deployment check (deployment vs build)
        env:
          INPUT_BASE: ${{ github.event.inputs.base }}
        run: |
          BASE="$INPUT_BASE"
          if [ -z "$BASE" ]; then BASE="$(head -1 reports/REMOTE_REQUEST)"; fi
          BASE="$BASE" python3 tools/parity_remote.py
      - name: Commit reports
        if: always()
        run: |
          git config user.name "trailgenic-snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add reports
          git commit -m "Parity report $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
