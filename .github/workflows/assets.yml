name: Fetch Webflow-hosted files
on:
  push:
    branches: [main]
    paths: ["tools/asset-urls.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: assets
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download files
        run: python3 tools/fetch_assets.py
      - name: Commit files
        run: |
          git config user.name "trailgenic-snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add assets tools/asset-map.json
          git commit -m "Fetch Webflow-hosted files $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
